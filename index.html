:root{--bg-top:#ffe4ef;--bg-mid:#fff1f5;--bg-bottom:#fffbeb;--card-bg:#fff;--primary:#ec4899;--primary-dark:#db2777;--primary-soft:#fce7f3;--border:#fbcfe8;--text:#292524;--muted:#78716c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 52%,var(--bg-bottom) 100%);padding:28px 16px 48px}
.container{max-width:460px;margin:0 auto}
.header{text-align:center;margin-bottom:22px}
.badge{display:inline-block;background:rgba(255,255,255,.9);color:var(--primary);font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(236,72,153,.12)}
.title{margin:8px 0 4px;font-size:32px;font-weight:900;color:var(--primary-dark);letter-spacing:.02em}
.subtitle{margin:0;font-size:13px;color:var(--muted)}
.card{background:rgba(255,255,255,.96);border:2px solid var(--border);border-radius:26px;padding:22px;box-shadow:0 12px 28px rgba(236,72,153,.14)}
.question-box{background:#fff5f8;border:1px solid #fce7f3;border-radius:18px;padding:14px;margin-bottom:16px}
.question-label{display:block;font-size:14px;font-weight:700;line-height:1.6;margin-bottom:8px}
.q-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:var(--primary);color:#fff;font-size:11px;font-weight:900;margin-right:6px;vertical-align:middle}
.kw{display:inline-block;background:var(--primary-soft);color:var(--primary-dark);font-weight:900;padding:0 6px;border-radius:6px;margin:0 1px}
.guide{margin:0 0 10px;padding:6px 10px;background:#fff;border-radius:10px;font-size:12px;color:var(--primary-dark);line-height:1.45}
.answer-input{width:100%;padding:11px 14px;font-size:16px;font-family:inherit;color:var(--text);background:#fff;border:2px solid var(--border);border-radius:14px;outline:none;transition:border-color .15s,box-shadow .15s}
.answer-input::placeholder{color:#d6d3d1;font-size:14px}
.answer-input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(236,72,153,.14)}
.role-box{background:#fffbeb;border:1px solid #fde68a;border-radius:18px;padding:14px;margin-bottom:20px}
.role-title{display:block;font-size:14px;font-weight:800;color:var(--text);margin-bottom:10px}
.role-grid{display:flex;flex-wrap:wrap;gap:8px}
.role-chip{position:relative;cursor:pointer}
.role-chip input{position:absolute;opacity:0;pointer-events:none}
.role-chip span{display:inline-block;padding:7px 12px;font-size:13px;font-weight:700;color:#57534e;background:#fff;border:2px solid #f5d0fe;border-radius:999px;transition:all .14s ease}
.role-chip input:checked+span{color:#fff;background:var(--primary);border-color:var(--primary);box-shadow:0 4px 10px rgba(236,72,153,.25)}
.btn-primary{width:100%;padding:15px 18px;font-size:16px;font-weight:900;font-family:inherit;color:#fff;background:linear-gradient(90deg,#ec4899 0%,#fb7185 100%);border:none;border-radius:18px;cursor:pointer;box-shadow:0 6px 16px rgba(236,72,153,.3);transition:transform .12s,opacity .15s}
.btn-primary:active:not(:disabled){transform:scale(.98)}
.btn-primary:disabled{background:#d6d3d1;box-shadow:none;cursor:not-allowed}
.result-card{text-align:center;padding:28px 22px}
.result-lead{margin:0;font-size:12px;font-weight:800;letter-spacing:.12em;color:#f472b6}
.result-name-box{margin:20px 0 24px;padding:32px 14px;border-radius:20px;border:2px dashed #f9a8d4;background:linear-gradient(135deg,#fdf2f8 0%,#fff 55%,#fefce8 100%)}
.result-name{margin:0;font-size:42px;font-weight:900;color:var(--primary-dark);letter-spacing:.06em;word-break:keep-all}
.btn-x{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 18px;margin-bottom:12px;font-size:14px;font-weight:800;font-family:inherit;color:#fff;background:#1c1917;border:none;border-radius:16px;text-decoration:none;cursor:pointer;transition:background .15s,transform .12s}
.btn-x:hover{background:#292524}.btn-x:active{transform:scale(.98)}
.btn-retry{width:100%;padding:14px 18px;font-size:14px;font-weight:800;font-family:inherit;color:var(--primary-dark);background:#fdf2f8;border:2px solid var(--border);border-radius:16px;cursor:pointer;transition:background .15s,transform .12s}
.btn-retry:hover{background:#fce7f3}.btn-retry:active{transform:scale(.98)}
.hidden{display:none}
</style>
</head>

<script>
const DEBUT_ROLES=["アイドル","コンカフェ嬢","キャバ嬢","ガールズバー店員","VTuber","配信者","声優","モデル","看板娘","ゆるキャラ"];
const QUESTION_MODIFIERS=["ぬれた","しかくい","さびた","まいごの","あまった","へんてこな","うその","つめたい","かたっぽだけの","うらがえしの","だまったままの","まちがえた","しめった","きいろくなった","ぎゃくまわりに動く","ちぐはぐな","おこってる","まよなかの","ぺちゃんこの","からっぽの","ざらざらの","かってに動く","ぐにゃぐにゃの","でっかい"];
const QUESTION_NOUNS=["せんぷうき","わごむ","るすばんでんわ","じしゃく","きたかぜ","けしごむ","うわばき","はぶらし","けいこうとう","じゃり","ぽすと","まんほーる","わりばし","めざましどけい","やきそば","でんち","ぞうきん","がびょう","あきかん","かーてん","せっけん","てーぷ","すいどうかん","すいとう"];
const QUESTION_TEMPLATES=[
{s:s=>`${s}は、いま**なに**をしてる？`},
{s:s=>`${s}をみつけたとき、**なん**て声をかける？`},
{s:s=>`${s}は**どこ**からやってきたと思う？`},
{s:s=>`${s}をとめるには、**どうやって**さわればいい？`},
{s:s=>`${s}がいちばんこまってることは、**どれ**？`},
{s:s=>`${s}が急に音をたてたのは、**なぜ**？`},
{s:s=>`${s}のせわをしているのは、**だれ**？`,guide:"身のまわりのだれ？ 同級生や仲間のだれ？ 芸能人やキャラでいうとだれ？"},
{s:s=>`${s}と一番なかよしになれそうなのは、**だれ**？`,guide:"身のまわりのだれ？ 同級生や仲間のだれ？ 芸能人やキャラでいうとだれ？"},
{s:s=>`${s}をゆずってもらうのに、**いくら**出す？`}
];
function parseNamesCsv(text){return text.trim().split(/\r?\n/).slice(1).filter(x=>x.trim()).map(line=>{const [id,name,category,level]=line.split(",").map(v=>v.trim());return{id,name,category,level:Number(level)}})}
function pickUniqueIndices(total,count){const set=new Set();while(set.size<count)set.add(Math.floor(Math.random()*total));return [...set]}
function generateQuestions(){const m=pickUniqueIndices(QUESTION_MODIFIERS.length,3),n=pickUniqueIndices(QUESTION_NOUNS.length,3),t=pickUniqueIndices(QUESTION_TEMPLATES.length,3);return [0,1,2].map(i=>{const subject=QUESTION_MODIFIERS[m[i]]+QUESTION_NOUNS[n[i]],tpl=QUESTION_TEMPLATES[t[i]];return{text:tpl.s(subject),guide:tpl.guide||""}})}
function appendHighlightedText(el,text){for(const part of text.split(/(\*\*[^*]+\*\*)/g)){if(part.startsWith("**")&&part.endsWith("**")){const span=document.createElement("span");span.className="kw";span.textContent=part.slice(2,-2);el.appendChild(span)}else if(part)el.appendChild(document.createTextNode(part))}}
async function sha256Bytes(str){const bytes=new TextEncoder().encode(str.normalize("NFC"));return new Uint8Array(await crypto.subtle.digest("SHA-256",bytes))}
async function decideGenjiname(questionTexts,answers,entries){const payload=[...questionTexts.map(q=>q.normalize("NFC")),"\x1e",...answers.map(a=>a.normalize("NFC"))].join("\x1f");const hash=await sha256Bytes(payload);let value64=0n;for(let i=0;i<8;i++)value64=(value64<<8n)|BigInt(hash[i]);const bucket=Number(value64%10000n);let sub64=0n;for(let i=8;i<16;i++)sub64=(sub64<<8n)|BigInt(hash[i]);if(bucket<6000){const pool=entries.filter(e=>e.category==="通常");return pool[Number(sub64%BigInt(pool.length))]}const level=Math.floor((bucket-6000)/800)+1;const pool=entries.filter(e=>e.category==="派生"&&e.level===level);return pool[Number(sub64%BigInt(pool.length))]}
const entries=parseNamesCsv(document.getElementById("names-csv").textContent);
const quizForm=document.getElementById("quiz-form"),questionsContainer=document.getElementById("questions-container"),rolesContainer=document.getElementById("roles-container"),submitBtn=document.getElementById("submit-btn"),resultView=document.getElementById("result-view"),resultNameEl=document.getElementById("result-name"),xShareBtn=document.getElementById("x-share-btn"),retryBtn=document.getElementById("retry-btn");
let currentQuestions=[],inputEls=[],selectedRole="";
function updateSubmitState(){submitBtn.disabled=!(inputEls.every(el=>el.value.trim())&&selectedRole)}
function renderRoles(){rolesContainer.textContent="";DEBUT_ROLES.forEach((role,idx)=>{const label=document.createElement("label");label.className="role-chip";const radio=document.createElement("input");radio.type="radio";radio.name="debut-role";radio.value=role;radio.id=`role-${idx}`;radio.addEventListener("change",()=>{selectedRole=role;updateSubmitState()});const span=document.createElement("span");span.textContent=role;label.append(radio,span);rolesContainer.appendChild(label)})}
function renderQuestions(){currentQuestions=generateQuestions();questionsContainer.textContent="";inputEls=[];currentQuestions.forEach((q,idx)=>{const box=document.createElement("div");box.className="question-box";const label=document.createElement("label");label.className="question-label";label.htmlFor=`q-input-${idx}`;const badge=document.createElement("span");badge.className="q-num";badge.textContent=`Q${idx+1}`;label.appendChild(badge);appendHighlightedText(label,q.text);box.appendChild(label);if(q.guide){const guide=document.createElement("p");guide.className="guide";guide.textContent="💡 "+q.guide;box.appendChild(guide)}const input=document.createElement("input");input.id=`q-input-${idx}`;input.type="text";input.className="answer-input";input.placeholder="思ったことを自由に入力してね";input.required=true;input.addEventListener("input",updateSubmitState);box.appendChild(input);questionsContainer.appendChild(box);inputEls.push(input)});updateSubmitState()}
quizForm.addEventListener("submit",async e=>{e.preventDefault();if(submitBtn.disabled)return;const answers=inputEls.map(el=>el.value),questionTexts=currentQuestions.map(q=>q.text);submitBtn.disabled=true;submitBtn.textContent="決定中...";try{const decided=await decideGenjiname(questionTexts,answers,entries);resultNameEl.textContent=decided.name;const tweetText=`あなたは『${decided.name}』として${selectedRole}デビュー！\n#源氏名メーカー`;const params=new URLSearchParams({text:tweetText,url:window.location.href});xShareBtn.href=`https://x.com/intent/tweet?${params}`;quizForm.classList.add("hidden");resultView.classList.remove("hidden")}finally{submitBtn.textContent="源氏名を決定する！";updateSubmitState()}});
retryBtn.addEventListener("click",()=>{resultView.classList.add("hidden");quizForm.classList.remove("hidden");selectedRole="";renderQuestions();renderRoles()});
renderQuestions();renderRoles();
</script>
